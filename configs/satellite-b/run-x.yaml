base_config: ./configs/satellite-b/base.yaml
run_desc: Run only cluster1.
parallel_jobs: false
data:
  satellites:
    - cluster1
  n_years_max: 1

lags: 0

inputs:
 - r[km]
 - theta[deg]
 - phi[deg]
 - imfby[nT]
 - imfbz[nT]
 - vsw[km/s]
 - nsw[1/cm^3]
 - ey[mV/m]
 - <ey>[mV/m]
 - <symh*>[nT]

models:
  - ols
  - nn_mimo
  - nn_mimo_resid

nn:
  n_epochs: 2
  nn_class: NeuralNetworkOneLayer
  hidden_size: 32
  activation: ReLU
